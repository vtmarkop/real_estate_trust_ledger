version: '3.8'

services:
  api:
    build: .
    container_name: mesitis_api
    restart: unless-stopped
    ports:
      - "8001:8000" # Αλλαγή: Το API πλέον ακούει στο localhost:8001
    environment:
      - DATABASE_URL=postgresql://myuser:mypassword@db:5432/mydb
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=your-highly-secure-cryptographic-key-here
    volumes:
      - .:/code
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  db:
    image: postgres:15-alpine
    container_name: mesitis_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=myuser
      - POSTGRES_PASSWORD=mypassword
      - POSTGRES_DB=mydb
    ports:
      - "5433:5432" # Αλλαγή: Η DB πλέον ακούει στο localhost:5433
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: mesitis_redis
    restart: unless-stopped
    ports:
      - "6380:6379" # Αλλαγή: Ο Redis ακούει στο localhost:6380
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000" # API Port (για να μιλάει το FastAPI και το Frontend)
      - "9001:9001" # Web UI Console (για να βλέπεις εσύ τα αρχεία)
    environment:
      MINIO_ROOT_USER: "admin"
      MINIO_ROOT_PASSWORD: "SuperSecretPassword123!"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  pgdata:
  redis_data:
  minio_data: